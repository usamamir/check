<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:" />
  <title>Streakly</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" data-theme="coral">
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand-block">
        <h1 class="brand">Streakly</h1>
        <p class="date-label" id="dateLabel"></p>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="statsBtn" title="Statistics" aria-label="Statistics">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M12 19V5M20 19v-7"/></svg>
        </button>
        <button type="button" class="icon-btn" id="themesBtn" title="Themes" aria-label="Themes">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1.1 1.5 1.1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </header>

    <main class="main-view" id="mainView">
      <section class="habits-page" id="habitsPage">
        <div class="habit-grid" id="habitGrid"></div>
        <div class="page-dots" id="pageDots"></div>
        <p class="page-hint" id="pageHint">Page 1 of 4 · up to 6 habits each</p>
      </section>
    </main>

    <nav class="bottom-bar">
      <button type="button" class="nav-btn active" data-view="today" id="navToday">Today</button>
      <button type="button" class="nav-btn" data-view="stats" id="navStats">Stats</button>
      <button type="button" class="add-fab" id="addHabitBtn" title="Add habit" aria-label="Add habit">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>

    <!-- Stats panel -->
    <section class="panel stats-panel hidden" id="statsPanel">
      <div class="panel-header">
        <h2>Statistics</h2>
        <button type="button" class="icon-btn close-panel" data-close="statsPanel" aria-label="Close">✕</button>
      </div>
      <div class="stats-summary" id="statsSummary"></div>
      <div class="stats-list" id="statsList"></div>
    </section>

    <!-- Themes panel -->
    <section class="panel themes-panel hidden" id="themesPanel">
      <div class="panel-header">
        <h2>Themes</h2>
        <button type="button" class="icon-btn close-panel" data-close="themesPanel" aria-label="Close">✕</button>
      </div>
      <div class="theme-grid" id="themeGrid"></div>
    </section>

    <!-- Settings panel -->
    <section class="panel settings-panel hidden" id="settingsPanel">
      <div class="panel-header">
        <h2>Settings</h2>
        <button type="button" class="icon-btn close-panel" data-close="settingsPanel" aria-label="Close">✕</button>
      </div>
      <label class="setting-row">
        <span>Reminders</span>
        <input type="checkbox" id="remindersToggle" checked />
      </label>
      <label class="setting-row">
        <span>Compact circles</span>
        <input type="checkbox" id="compactToggle" />
      </label>
      <button type="button" class="danger-btn" id="resetDataBtn">Reset all data</button>
      <p class="settings-note">Data is stored only on this computer. No account required.</p>
    </section>

    <!-- Habit editor modal -->
    <div class="modal-backdrop hidden" id="habitModal">
      <div class="modal" role="dialog" aria-labelledby="habitModalTitle">
        <div class="modal-header">
          <h2 id="habitModalTitle">Add habit</h2>
          <button type="button" class="icon-btn" id="closeHabitModal" aria-label="Close">✕</button>
        </div>
        <form id="habitForm">
          <input type="hidden" id="habitId" />

          <label class="field">
            <span>Name</span>
            <input type="text" id="habitName" maxlength="40" placeholder="e.g. Drink water" required />
          </label>

          <div class="field">
            <span>Type</span>
            <div class="segmented" id="habitTypeSeg">
              <button type="button" class="seg active" data-type="positive">Build</button>
              <button type="button" class="seg" data-type="negative">Break</button>
              <button type="button" class="seg" data-type="timed">Timed</button>
            </div>
          </div>

          <label class="field timed-only hidden" id="timerField">
            <span>Duration (minutes)</span>
            <input type="number" id="habitDuration" min="1" max="180" value="3" />
          </label>

          <div class="field">
            <span>Schedule</span>
            <select id="habitSchedule">
              <option value="daily">Every day</option>
              <option value="weekdays">Weekdays</option>
              <option value="weekends">Weekends</option>
              <option value="custom">Custom days</option>
              <option value="times_per_week">Times per week</option>
            </select>
          </div>

          <div class="field custom-days hidden" id="customDaysField">
            <span>Days</span>
            <div class="day-pills" id="dayPills">
              <button type="button" class="day-pill" data-day="0">S</button>
              <button type="button" class="day-pill" data-day="1">M</button>
              <button type="button" class="day-pill" data-day="2">T</button>
              <button type="button" class="day-pill" data-day="3">W</button>
              <button type="button" class="day-pill" data-day="4">T</button>
              <button type="button" class="day-pill" data-day="5">F</button>
              <button type="button" class="day-pill" data-day="6">S</button>
            </div>
          </div>

          <label class="field times-week hidden" id="timesWeekField">
            <span>Times per week</span>
            <input type="number" id="habitTimesPerWeek" min="1" max="7" value="3" />
          </label>

          <div class="field">
            <span>Icon</span>
            <div class="icon-picker" id="iconPicker"></div>
          </div>

          <div class="field">
            <span>Color</span>
            <div class="color-picker" id="colorPicker"></div>
          </div>

          <label class="field">
            <span>Reminder time (optional)</span>
            <input type="time" id="habitReminder" />
          </label>

          <div class="modal-actions">
            <button type="button" class="ghost-btn danger hidden" id="deleteHabitBtn">Delete</button>
            <div class="spacer"></div>
            <button type="button" class="ghost-btn" id="cancelHabitBtn">Cancel</button>
            <button type="submit" class="primary-btn">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Habit detail / notes / timer -->
    <div class="modal-backdrop hidden" id="detailModal">
      <div class="modal detail-modal" role="dialog">
        <div class="modal-header">
          <h2 id="detailTitle">Habit</h2>
          <button type="button" class="icon-btn" id="closeDetailModal" aria-label="Close">✕</button>
        </div>
        <div class="detail-body">
          <div class="detail-streak" id="detailStreak"></div>
          <div class="detail-calendar" id="detailCalendar"></div>
          <div class="timer-block hidden" id="timerBlock">
            <div class="timer-display" id="timerDisplay">03:00</div>
            <div class="timer-actions">
              <button type="button" class="primary-btn" id="timerStartBtn">Start</button>
              <button type="button" class="ghost-btn" id="timerResetBtn">Reset</button>
            </div>
          </div>
          <label class="field">
            <span>Today's note</span>
            <textarea id="detailNote" rows="3" placeholder="How did it go?"></textarea>
          </label>
          <div class="modal-actions">
            <button type="button" class="ghost-btn" id="editFromDetailBtn">Edit</button>
            <div class="spacer"></div>
            <button type="button" class="primary-btn" id="toggleCompleteBtn">Mark done</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
