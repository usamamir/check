appId: com.forge.app
productName: FORGE
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
  - '!.cache/*'
  - '!**/.cache/**'
  - '!dist/*'
  - '!FORGE-Setup-*.zip'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: FORGE
  artifactName: FORGE-Setup-${version}.${ext}
nsis:
  artifactName: FORGE-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: FORGE needs access to save workout backups.
    - NSDownloadsFolderUsageDescription: FORGE needs access to export workout data.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: forge.app
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
